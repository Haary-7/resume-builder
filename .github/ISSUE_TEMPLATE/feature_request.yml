name: Feature request
description: Suggest an improvement to the editor or CLI.
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the workflow and any alternatives considered.
    validations:
      required: true
